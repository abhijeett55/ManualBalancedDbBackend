version : '3.8'


services:
  minio:
    image: minio/minio:latest
    container_name: minio


    ports:
      - "9000:9000"
      - "9001:9001"


    environment:
      MINIO_ROOT_LOCAL: local
      MINIO_ROOT_PASSWORD: Avi@123456789

    volumes:
      - ./minio-data:/data

    command: server /data --console-address ":9001"

    restart: unless-stopped